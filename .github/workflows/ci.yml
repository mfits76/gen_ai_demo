name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run CLI demo (mock LLM)
        run: python examples/run_demo.py

      - name: Export static demo output
        run: python scripts/export_demo_output.py

      - name: Upload demo output artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: docs/demo-output.json
